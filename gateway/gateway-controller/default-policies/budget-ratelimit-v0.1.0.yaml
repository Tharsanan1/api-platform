name: budget-ratelimit
version: v0.1.0
description: |
  Budget-based rate limiting policy that limits API usage based on monetary cost
  calculated from LLM token consumption. Users define pricing per token type
  (cost per 1M tokens) and set budget limits. The policy computes cost as
  tokens × (costPer1MTokens / 1,000,000) and enforces budget limits.

  Key features:
  - Separate budgets for prompt token costs, completion token costs, and total costs
  - Configurable pricing per 1M tokens for both prompt and completion tokens
  - Flexible token extraction from response body (JSON path), headers, or metadata
  - Multiple concurrent budget limits per type (e.g., $100/hour AND $1000/day)
  - Configurable behavior when token extraction fails

parameters:
  type: object
  additionalProperties: false
  required: ["pricing"]
  properties:
    pricing:
      type: object
      description: Token pricing configuration
      additionalProperties: false
      required: ["promptTokens", "completionTokens"]
      properties:
        promptTokens:
          type: object
          description: Pricing for prompt/input tokens
          additionalProperties: false
          required: ["costPer1MTokens", "tokenSource"]
          properties:
            costPer1MTokens:
              type: number
              description: Cost per 1 million prompt tokens (e.g., 10.00 for $10/1M tokens)
              minimum: 0
            tokenSource:
              type: object
              description: |
                Configuration for extracting token count. Supports extraction from response body
                (via JSON path), response headers, or response metadata.
              additionalProperties: false
              required: ["type"]
              properties:
                type:
                  type: string
                  description: |
                    Type of source to extract token count from:
                    - response_body: Extract from JSON response body using jsonPath
                    - response_header: Extract from response header using key
                    - response_metadata: Extract from response metadata using key
                  enum: ["response_body", "response_header", "response_metadata"]
                key:
                  type: string
                  description: |
                    Header name (for response_header) or metadata key (for response_metadata).
                    Required when type is response_header or response_metadata.
                  minLength: 1
                  maxLength: 256
                jsonPath:
                  type: string
                  description: |
                    JSON path expression for extracting token count from response body.
                    Required when type is response_body.
                    Example: "$.usage.prompt_tokens"
                  minLength: 1
                  maxLength: 512
        completionTokens:
          type: object
          description: Pricing for completion/output tokens
          additionalProperties: false
          required: ["costPer1MTokens", "tokenSource"]
          properties:
            costPer1MTokens:
              type: number
              description: Cost per 1 million completion tokens (e.g., 30.00 for $30/1M tokens)
              minimum: 0
            tokenSource:
              type: object
              description: |
                Configuration for extracting token count. Supports extraction from response body
                (via JSON path), response headers, or response metadata.
              additionalProperties: false
              required: ["type"]
              properties:
                type:
                  type: string
                  description: |
                    Type of source to extract token count from:
                    - response_body: Extract from JSON response body using jsonPath
                    - response_header: Extract from response header using key
                    - response_metadata: Extract from response metadata using key
                  enum: ["response_body", "response_header", "response_metadata"]
                key:
                  type: string
                  description: |
                    Header name (for response_header) or metadata key (for response_metadata).
                    Required when type is response_header or response_metadata.
                  minLength: 1
                  maxLength: 256
                jsonPath:
                  type: string
                  description: |
                    JSON path expression for extracting token count from response body.
                    Required when type is response_body.
                    Example: "$.usage.completion_tokens"
                  minLength: 1
                  maxLength: 512

    promptBudget:
      type: object
      description: Budget limit for prompt token costs only
      additionalProperties: false
      properties:
        limits:
          type: array
          description: Array of budget limits for prompt token costs
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: ["limit", "duration"]
            properties:
              limit:
                type: number
                description: Maximum budget (cost units) allowed in the duration
                minimum: 0
              duration:
                type: string
                description: |
                  Time window for the budget limit (Go duration string format).
                  Examples: "1s", "1m", "1h", "24h"
                pattern: "^[-+]?(([0-9]+(\\.[0-9]*)?|\\.[0-9]+)(ns|us|µs|ms|s|m|h))+$"

    completionBudget:
      type: object
      description: Budget limit for completion token costs only
      additionalProperties: false
      properties:
        limits:
          type: array
          description: Array of budget limits for completion token costs
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: ["limit", "duration"]
            properties:
              limit:
                type: number
                description: Maximum budget (cost units) allowed in the duration
                minimum: 0
              duration:
                type: string
                description: |
                  Time window for the budget limit (Go duration string format).
                  Examples: "1s", "1m", "1h", "24h"
                pattern: "^[-+]?(([0-9]+(\\.[0-9]*)?|\\.[0-9]+)(ns|us|µs|ms|s|m|h))+$"

    totalBudget:
      type: object
      description: Budget limit for combined prompt + completion costs
      additionalProperties: false
      properties:
        limits:
          type: array
          description: Array of budget limits for total costs
          minItems: 1
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: ["limit", "duration"]
            properties:
              limit:
                type: number
                description: Maximum total budget (cost units) allowed in the duration
                minimum: 0
              duration:
                type: string
                description: |
                  Time window for the budget limit (Go duration string format).
                  Examples: "1s", "1m", "1h", "24h"
                pattern: "^[-+]?(([0-9]+(\\.[0-9]*)?|\\.[0-9]+)(ns|us|µs|ms|s|m|h))+$"

    onExtractionFailure:
      type: object
      description: Behavior when token count cannot be extracted from response
      additionalProperties: false
      properties:
        action:
          type: string
          description: |
            Action to take when extraction fails:
            - skip: Don't count this request (fail-open, cost=0)
            - default: Use defaultValue as the token count (applies pricing multiplier)
          enum: ["skip", "default"]
          default: "skip"
        defaultValue:
          type: integer
          description: Token count to use when action=default (pricing multiplier is applied)
          minimum: 0
          default: 0

systemParameters:
  type: object
  additionalProperties: false
  properties:
    algorithm:
      type: string
      description: |
        Rate limiting algorithm to use:
        - gcra: Generic Cell Rate Algorithm (default). Provides smooth rate limiting
          with burst support and token bucket semantics.
        - fixed-window: Simple fixed time window counter.
      enum: ["gcra", "fixed-window"]
      default: "gcra"
      "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.algorithm}"

    backend:
      type: string
      description: |
        Rate limit storage backend. 'memory' for in-memory storage (single-instance),
        'redis' for distributed rate limiting across multiple gateway instances.
      enum: ["memory", "redis"]
      default: "memory"
      "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.backend}"

    redis:
      type: object
      description: Redis configuration (only used when backend=redis)
      additionalProperties: false
      properties:
        host:
          type: string
          description: Redis server hostname or IP address
          default: "localhost"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.host}"

        port:
          type: integer
          description: Redis server port
          minimum: 1
          maximum: 65535
          default: 6379
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.port}"

        password:
          type: string
          description: Redis authentication password (optional)
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.password}"

        username:
          type: string
          description: Redis ACL username (optional, Redis 6+)
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.username}"

        db:
          type: integer
          description: Redis database number
          minimum: 0
          maximum: 15
          default: 0
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.db}"

        keyPrefix:
          type: string
          description: Prefix for all Redis keys to avoid conflicts
          default: "ratelimit:v1:"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.keyprefix}"

        failureMode:
          type: string
          description: |
            Behavior when Redis is unavailable. 'open' allows requests through,
            'closed' denies requests. Recommended: 'open' for availability.
          enum: ["open", "closed"]
          default: "open"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.failuremode}"

        connectionTimeout:
          type: string
          description: Redis connection timeout (Go duration string)
          default: "5s"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.connectiontimeout}"

        readTimeout:
          type: string
          description: Redis read timeout (Go duration string)
          default: "3s"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.readtimeout}"

        writeTimeout:
          type: string
          description: Redis write timeout (Go duration string)
          default: "3s"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.redis.writetimeout}"

    memory:
      type: object
      description: In-memory storage configuration (only used when backend=memory)
      additionalProperties: false
      properties:
        maxEntries:
          type: integer
          description: |
            Maximum number of rate limit entries to store in memory.
            Oldest entries are evicted when limit is reached.
          minimum: 100
          maximum: 10000000
          default: 10000
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.memory.maxentries}"

        cleanupInterval:
          type: string
          description: |
            Interval for cleaning up expired entries (Go duration string).
            Use "0" to disable periodic cleanup.
          default: "5m"
          "wso2/defaultValue": "${config.policy_configurations.ratelimit_v010.memory.cleanupinterval}"
