# Blocks of the default client certificate to backends. They name the tls-backend component,
# so they join the blocks list of it-suite.yaml once that component is registered.
#
# The switch is gateway configuration and the default identity is gateway-wide state, so each
# block runs its scenarios one at a time.
blocks:
  - name: gateway-mtls-default-identity-off
    parallel: 1
    components:
      - name: platform-gateway
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
      - name: tls-backend
    runners:
      - name: mtls-default-identity-off
        tags: "gateway-version>1.2.0;@default-identity-off"
        features:
          - features/mtls_default_identity.feature

  - name: gateway-mtls-default-identity-on
    parallel: 1
    components:
      - name: platform-gateway
        overlay: tests/framework/core/catalog/overlays/mtls-default-identity.toml
        db:
          matrix: [sqlite, postgres, sqlserver]
      - name: testbench
      - name: tls-backend
    runners:
      - name: mtls-default-identity-on
        tags: "gateway-version>1.2.0;@default-identity-on"
        features:
          - features/mtls_default_identity.feature
