name: Release Gateway Controller

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0-m4)'
        required: true
        type: string

env:
  IMAGE_NAME: api-platform-gateway-controller
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: tharsanan1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker image
        working-directory: gateway/gateway-controller
        run: |
          docker build -f Dockerfile -t wso2/${{ env.IMAGE_NAME }}:${{ inputs.version }} ../

      - name: Tag Docker image
        run: |
          docker tag wso2/${{ env.IMAGE_NAME }}:${{ inputs.version }} ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}

      - name: Image Summary
        run: |
          echo "### Gateway Controller Image Released :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
